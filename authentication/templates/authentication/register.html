{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد</title>
    <!-- ربط ملف الـ CSS الخارجي عبر نظام Static الخاص بدجانجو -->
    <link rel="stylesheet" href="{% static 'authentication/css/register.css' %}">
</head>
<body>

    <div class="register-card">
        <h2>إنشاء حساب جديد</h2>

        <!-- عرض رسائل النجاح أو التنبيهات -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">تسجيل الحساب</button>
        </form>
    </div>

</body>
</html>
