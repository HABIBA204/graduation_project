{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <!-- ربط ملف الـ CSS الخاص بتسجيل الدخول -->
    <link rel="stylesheet" href="{% static 'authentication/css/login.css' %}">
</head>
<body>
    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        
        <!-- عرض رسائل التنبيه أو الخطأ إن وجدت -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">دخول</button>
        </form>
    </div>
</body>
</html>
